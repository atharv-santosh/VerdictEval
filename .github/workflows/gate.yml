name: eval-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv and install
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev,web]"

      - name: Type check
        run: |
          source .venv/bin/activate
          mypy src/aeh

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          pytest -v

      - name: Run demo suite (record mode, offline fake backend)
        run: |
          source .venv/bin/activate
          aeh run --suite demo/suite.yaml --cassette-dir /tmp/cassettes --mode record --out /tmp/results.json

      - name: Calibrate the offline judge on the held-out split
        run: |
          source .venv/bin/activate
          aeh calibrate --data data/calibration_set.jsonl --split holdout --out /tmp/calibration.json

      - name: Generate report
        run: |
          source .venv/bin/activate
          aeh report --results /tmp/results.json --calibration /tmp/calibration.json --html-out /tmp/report.html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: aeh-report
          path: /tmp/report.html

      - name: Regression gate against committed baseline
        run: |
          source .venv/bin/activate
          aeh gate --baseline demo/baseline.json --results /tmp/results.json
