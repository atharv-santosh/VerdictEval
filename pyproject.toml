[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "pytest for agents: trajectory recording, deterministic replay, judged scoring, and regression gating for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Atharv Santosh" }]
dependencies = [
  "pyyaml>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "httpx>=0.27",
]
gemini = [
  "google-genai>=1.0",
]
web = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
aeh = "aeh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aeh"]

[tool.hatch.build.targets.wheel.force-include]
"src/aeh/web/static" = "aeh/web/static"
"src/aeh/web/templates" = "aeh/web/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
