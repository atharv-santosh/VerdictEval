<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eval Studio</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="brand-name">Eval Studio</h1>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="author">Author</button>
        <button class="tab" data-tab="run">Run</button>
        <button class="tab" data-tab="results">Results</button>
        <button class="tab" data-tab="calibration">Calibration</button>
        <button class="tab" data-tab="gate">Gate</button>
        <button class="tab" data-tab="cassettes">Cassettes</button>
      </nav>
    </header>
    <div id="mode-banner" class="mode-banner"></div>
    <main id="views"></main>
    <div id="toast-root" class="toast-root"></div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
