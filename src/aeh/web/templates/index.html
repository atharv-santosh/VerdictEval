<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eval Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">AEH</span>
        <span class="brand-name">Eval Studio</span>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="author">Author</button>
        <button class="tab" data-tab="run">Run</button>
        <button class="tab" data-tab="results">Results</button>
        <button class="tab" data-tab="calibration">Judge Calibration</button>
        <button class="tab" data-tab="gate">Baseline &amp; Gate</button>
        <button class="tab" data-tab="cassettes">Cassettes</button>
      </nav>
    </header>
    <div id="mode-banner" class="mode-banner"></div>
    <main id="views"></main>
    <div id="toast-root" class="toast-root"></div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
